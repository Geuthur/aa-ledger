{% load i18n %}
<div class="card card-body mt-2 rounded">
    <!-- Planetary Ledger Table -->
    <div class="table-responsive">
        <table class="table table-hover w-100" id="planets-details">
            <thead>
                <th class="w-auto">{% translate "Character" %}</th>
                <th class="w-auto">{% translate "Planet" %}</th>
                <th class="w-auto">{% translate "Upgrade Level" %}</th>
                <th class="w-auto">{% translate "Products" %}</th>
                <th class="w-auto">{% translate "Progress" %}</th>
                <th class="w-auto">{% translate "Extractor" %}</th>
                <th class="w-auto">{% translate "Status" %}</th>
                <th class="w-auto">{% translate "Last Updated" %}</th>
                <th class="w-auto">{% translate "Actions" %}</th>
            </thead>

            <tbody>
                <tr>
                    <td colspan="9" class="text-center" id="loading-message-container">
                        <div class="spinner-border text-primary">
                            <span class="visually-hidden">{% translate "Loading..." %}</span>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
